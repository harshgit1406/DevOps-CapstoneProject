services:
  app:
    build: .
    image: devops-capstone:local
    container_name: capstone-app
    environment:
      APP_ENV: compose
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
      PROMETHEUS_URL: http://localhost:${PROMETHEUS_PORT:-9090}
    ports: ["${APP_PORT:-8080}:5000"]
    restart: unless-stopped
    networks: [capstone]
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: capstone-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped
    networks: [capstone]
  grafana:
    image: grafana/grafana:12.1.1
    container_name: capstone-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [capstone]
  sonarqube:
    image: sonarqube:community
    profiles: [quality]
    ports: ["${SONAR_PORT:-9000}:9000"]
    volumes: ["sonar-data:/opt/sonarqube/data"]
    networks: [capstone]
networks: {capstone: {name: capstone-network}}
volumes: {prometheus-data: {}, grafana-data: {}, sonar-data: {}}
